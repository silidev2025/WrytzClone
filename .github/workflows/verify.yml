name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: wrytz_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d wrytz_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CRAFTBASE_SECRET: ci-only-secret-never-use-in-production-12345
      TEST_DATABASE_URL: postgres://test:ci-test-only@127.0.0.1:5432/wrytz_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:security
      - run: npm run test:collaboration
      - run: npm run test:mobile
      - run: npm run test:postgres
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
